<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ffb13b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="bar">
  <div class="brand">LUMEN</div>

  <div class="masters">
    <label class="master">
      <span>Grand</span>
      <input id="gm" type="range" min="0" max="100" value="100">
      <b id="gmv">100</b>
    </label>
    <button id="blackout" class="danger">Blackout</button>
  </div>

  <div class="status">
    <span id="stat-fixtures">—</span>
    <span id="stat-dmx">—</span>
    <span id="stat-prog">—</span>
    <span id="link" class="link-bad">connecting…</span>
  </div>
</header>

<!-- Window buttons, ChamSys style: one per main window, always visible (§2.1) -->
<nav id="windowbar"></nav>

<main id="grid"></main>

<footer id="cmdbar">
  <span class="prompt">&gt;</span>
  <input id="cmd" type="text" spellcheck="false" autocomplete="off"
         placeholder="Fixture 1 Thru 8 At 100   ·   Help   ·   ↑ for history">
  <div id="reply"></div>
</footer>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
